<style>
  :root {
    --blue: #005CAF;
    --blue-light: #1A75C7;
    --ivory: #F6F1EB;
    --warm-white: #FAF8F5;
    --charcoal: #2A2A28;
    --stone-light: #C8BFAE;
    --text-secondary: #5A5852;
    --text-light: #8A857D;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--warm-white);
    color: var(--charcoal);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  /* NAV */
  nav {
    flex-shrink: 0;
    padding: 0.9rem 3rem;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(250,248,245,0.94);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 1px 0 rgba(42,42,40,0.06);
    z-index: 100;
  }
  .nav-logo {
    font-family: 'adobe-garamond-pro', 'Adobe Garamond Pro', 'Cormorant Garamond', serif;
    font-size: 1.5rem; font-weight: 600; letter-spacing: 0.04em;
    color: var(--charcoal); text-decoration: none;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .lux-dot {
    width: 24px; height: auto; display: inline-block;
    vertical-align: middle; margin-right: 2px;
  }
  .nav-links {
    display: flex; gap: 2.5rem; list-style: none; align-items: center;
  }
  .nav-links a {
    font-size: 0.8rem; font-weight: 500; text-decoration: none;
    color: var(--text-secondary);
    letter-spacing: 0.1em; text-transform: uppercase;
    transition: color 0.3s; position: relative;
  }
  .nav-links a::after {
    content: ''; position: absolute; bottom: -4px; left: 0;
    width: 0; height: 1px; background: var(--blue);
    transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
  }
  .nav-links a:hover { color: var(--blue); }
  .nav-links a:hover::after { width: 100%; }

  /* EMBED — fills remaining viewport */
  .embed-wrap {
    flex: 1;
    min-height: 0;
    width: 100%;
    overflow: hidden;
  }
  .calendly-inline-widget {
    width: 100%;
    height: 100% !important;
    min-width: 320px;
    min-height: 0 !important;
  }
  .calendly-inline-widget iframe {
    height: 100% !important;
    min-height: 0 !important;
  }

  /* COMPACT FOOTER */
  footer {
    flex-shrink: 0;
    background: var(--charcoal); color: var(--ivory);
    padding: 0.9rem 3rem;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.72rem; letter-spacing: 0.04em;
  }
  .footer-copy { color: var(--text-light); }
  .footer-links { display: flex; gap: 1.5rem; align-items: center; }
  .footer-links a {
    text-decoration: none;
    color: var(--text-light);
    transition: color 0.3s;
  }
  .footer-links a:hover { color: var(--stone-light); }
  .footer-mail {
    color: var(--stone-light) !important;
    font-size: 0.78rem;
  }
  .footer-mail:hover { color: var(--blue-light) !important; }

  /* MOBILE */
  .mobile-toggle {
    display: none; flex-direction: column; gap: 5px;
    cursor: pointer; background: none; border: none; padding: 4px;
  }
  .mobile-toggle span {
    width: 24px; height: 1.5px; background: var(--charcoal); transition: all 0.3s;
  }
  .mobile-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 99;
    opacity: 0; transition: opacity 0.3s;
  }
  .mobile-overlay.active { display: block; opacity: 1; }
  .mobile-close {
    display: none; position: absolute; top: 1.5rem; right: 1.5rem;
    background: none; border: none; font-size: 1.5rem;
    color: var(--charcoal); cursor: pointer;
  }

  @media (max-width: 900px) {
    nav { padding: 0.55rem 1.25rem; }
    .nav-logo { font-size: 1.25rem; }
    .lux-dot { width: 20px; }
    .mobile-toggle { display: flex; }
    .nav-links {
      position: fixed; top: 0; right: -100%;
      width: 280px; height: 100vh;
      background: var(--warm-white);
      flex-direction: column; padding: 5rem 2rem 2rem;
      gap: 1.5rem;
      box-shadow: -10px 0 40px rgba(0,0,0,0.1);
      transition: right 0.4s cubic-bezier(0.4,0,0.2,1);
      align-items: flex-start;
      z-index: 101;
    }
    .nav-links.open { right: 0; }
    .nav-links.open .mobile-close { display: block; }
    footer {
      padding: 0.5rem 1.25rem;
      font-size: 0.62rem;
    }
    .footer-mail { display: none; }
    .footer-links { gap: 0.9rem; }
  }
</style>
</head>

<script>
  // Pass through URL params (email, name, etc.) to Calendly for prefill
  (function() {
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email');
    const name = params.get('name');
    const widget = document.getElementById('calendlyWidget');
    let url = 'https://calendly.com/drmeschino-luminosa/15?hide_gdpr_banner=1&primary_color=005CAF';
    if (email) url += '&email=' + encodeURIComponent(email);
    if (name) url += '&name=' + encodeURIComponent(name);
    widget.setAttribute('data-url', url);
  })();
</script>

<script>
  // Fire Meta Pixel Lead event when Calendly booking completes
  // (fbq only exists if user accepted cookies via cookie-consent.js)
  window.addEventListener('message', function(e) {
    if (e.data.event && e.data.event === 'calendly.event_scheduled') {
      if (typeof fbq === 'function') fbq('track', 'Lead');
    }
  });
</script>
<script>
  const toggle = document.getElementById('mobileToggle');
  const navLinks = document.getElementById('navLinks');
  const overlay = document.getElementById('mobileOverlay');
  const closeBtn = document.getElementById('mobileClose');
  const closeNav = () => {
    navLinks.classList.remove('open');
    overlay.classList.remove('active');
  };
  if (toggle) toggle.addEventListener('click', () => {
    navLinks.classList.add('open');
    overlay.classList.add('active');
  });
  if (overlay) overlay.addEventListener('click', closeNav);
  if (closeBtn) closeBtn.addEventListener('click', closeNav);
  navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', closeNav));
</script>

<script src="/cookie-consent.js"></script>
